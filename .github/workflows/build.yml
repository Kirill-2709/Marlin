name: Build Marlin Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    - name: Run PlatformIO Build (Try RC chip)
      continue-on-error: true # Если этот чип не подойдет, скрипт не упадет, а пойдет дальше
      run: |
        pio run -e STM32F103RC_btt

    - name: Run PlatformIO Build (Try RE chip if RC failed)
      run: |
        # Проверяем, создался ли файл. Если нет — собираем под чип RE
        if [ ! -f .pio/build/STM32F103RC_btt/firmware.bin ]; then
          echo "RC environment failed or missing, trying RE chip..."
          pio run -e STM32F103RE_btt
        fi

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Marlin-SKR-Mini-E3-V2
        path: .pio/build/**/firmware.bin
