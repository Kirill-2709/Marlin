name: Build Marlin Firmware

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Pip and PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    - name: Run PlatformIO Build
      run: |
        # Здесь мы указываем окружение для платы SKR Mini E3 V2.
        # Если у вас чип RE, замените на STM32F103RE_btt
        pio run -e stm32f103rc_btt

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Marlin-SKR-Mini-E3-V2
        path: .pio/build/stm32f103rc_btt/firmware.bin
